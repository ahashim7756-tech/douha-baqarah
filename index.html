<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>دوحة البقرة والذكر المستمر</title>
    
    <!-- إعدادات الـ PWA والمتصفح -->
    <link rel="manifest" href="/douha-baqarah/manifest.json">
    <meta name="theme-color" content="#059669">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="دوحة البقرة">
    <link rel="apple-touch-icon" href="/douha-baqarah/icon-192.png">

    <!-- المكتبات والخطوط الأساسية -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Cairo', sans-serif; }
        .font-quran { font-family: 'Amiri', serif; }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col justify-between selection:bg-emerald-500 selection:text-white">

    <!-- الشريط العلوي -->
    <header class="bg-gray-900 border-b border-gray-800 p-4 sticky top-0 z-50 shadow-md">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="w-10 h-10 rounded-xl bg-emerald-600 flex items-center justify-center shadow-lg shadow-emerald-900/40 text-xl">📖</div>
                <div>
                    <h1 class="font-bold text-lg text-emerald-400">دوحة البقرة</h1>
                    <p class="text-xs text-gray-400">الاستماع السلس والأذكار</p>
                </div>
            </div>
            
            <div class="flex items-center gap-2">
                <!-- زر التثبيت البرمجي -->
                <button id="installAppBtn" class="hidden bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold px-3 py-2 rounded-lg transition shadow flex items-center gap-1.5">
                    <i class="fa-solid fa-download"></i> تثبيت التطبيق
                </button>
                <div id="statusIndicator" class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse" title="متصل وجاهز للعمل"></div>
            </div>
        </div>
    </header>

    <!-- المحتوى الرئيسي للمنظومة -->
    <main class="max-w-4xl w-full mx-auto p-4 flex-grow flex flex-col justify-center items-center text-center my-6">
        <div class="bg-gray-900/80 border border-gray-800 rounded-2xl p-6 md:p-10 shadow-xl max-w-xl w-full backdrop-blur-sm">
            <span class="text-emerald-400 text-sm font-semibold tracking-wider uppercase mb-2 block">سورة البقرة المباركة</span>
            <h2 class="text-2xl md:text-3xl font-quran text-emerald-100 mb-6">«بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ»</h2>
            
            <div class="text-gray-300 text-sm md:text-base leading-relaxed mb-8 bg-gray-950/60 p-4 rounded-xl border border-gray-800/80">
                منظومة رقمية متكاملة تتيح لك الاستماع للتلاوة الهادئة مع أذكار الصباح والمساء ببيئة نقية تعمل بكفاءة تامة حتى بدون إنترنت.
            </div>

            <!-- مشغل الصوت النموذجي (مع السيرفر المستقر الجديد) -->
            <div class="flex flex-col gap-4">
                <audio id="audioPlayer" preload="auto" src="https://server11.mp3quran.net/sds/002.mp3"></audio>
                
                <div class="flex justify-center items-center gap-4">
                    <button id="playBtn" class="bg-emerald-600 hover:bg-emerald-500 text-white w-14 h-14 rounded-full flex items-center justify-center text-xl shadow-lg transition transform active:scale-95">
                        <i id="playIcon" class="fa-solid fa-play"></i>
                    </button>
                </div>
                <div class="text-xs text-gray-400 mt-2" id="playerStatus">جاهز للتشغيل</div>
            </div>
        </div>
    </main>

    <!-- تذييل الصفحة -->
    <footer class="bg-gray-900 border-t border-gray-800 text-center py-4 text-xs text-gray-500">
        جميع الحقوق محفوظة - دوحة البقرة والذكر المستمر © 2026
    </footer>

    <!-- سكربتات التحكم والـ Service Worker والتثبيت -->
    <script>
        const audio = document.getElementById('audioPlayer');
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        const playerStatus = document.getElementById('playerStatus');

        playBtn.addEventListener('click', () => {
            if (audio.paused) {
                audio.play().then(() => {
                    playIcon.className = 'fa-solid fa-pause';
                    playerStatus.textContent = 'جاري التلاوة...';
                }).catch(err => {
                    playerStatus.textContent = 'تعذر التشغيل، يرجى النقر مرة أخرى';
                });
            } else {
                audio.pause();
                playIcon.className = 'fa-solid fa-play';
                playerStatus.textContent = 'متوقف مؤقتاً';
            }
        });

        // التعامل مع زر التثبيت PWA Install Prompt
        let deferredPrompt;
        const installBtn = document.getElementById('installAppBtn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.classList.remove('hidden');
        });

        installBtn.addEventListener('click', async () => {
            if (!deferredPrompt) return;
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') {
                installBtn.classList.add('hidden');
            }
            deferredPrompt = null;
        });

        // تسجيل ملف الخدمة Service Worker بالمسار الدقيق
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/douha-baqarah/sw.js', { scope: '/douha-baqarah/' })
                    .then((reg) => console.log('Service Worker registered successfully, scope:', reg.scope))
                    .catch((err) => console.error('Service Worker registration failed:', err));
            });
        }
    </script>
</body>
</html>
